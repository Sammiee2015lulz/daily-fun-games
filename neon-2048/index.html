<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon 2048</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #0a0a1a;
            font-family: 'Arial', sans-serif;
            color: #fff;
        }
        h1 {
            font-size: 3em;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            margin: 20px;
        }
        .score {
            font-size: 1.5em;
            margin: 10px;
            text-shadow: 0 0 10px #f0f;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
            background: #1a1a2e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 0 30px #0ff;
        }
        .cell {
            width: 100px;
            height: 100px;
            background: #16213e;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2em;
            font-weight: bold;
            transition: all 0.2s;
        }
        .cell[data-value="2"] { background: #ff6b6b; box-shadow: 0 0 15px #ff6b6b; }
        .cell[data-value="4"] { background: #ffa07a; box-shadow: 0 0 15px #ffa07a; }
        .cell[data-value="8"] { background: #ffd93d; box-shadow: 0 0 15px #ffd93d; }
        .cell[data-value="16"] { background: #6bcf7f; box-shadow: 0 0 15px #6bcf7f; }
        .cell[data-value="32"] { background: #4ecdc4; box-shadow: 0 0 15px #4ecdc4; }
        .cell[data-value="64"] { background: #45b7d1; box-shadow: 0 0 15px #45b7d1; }
        .cell[data-value="128"] { background: #96ceb4; box-shadow: 0 0 20px #96ceb4; font-size: 1.5em; }
        .cell[data-value="256"] { background: #ffeaa7; box-shadow: 0 0 20px #ffeaa7; font-size: 1.5em; }
        .cell[data-value="512"] { background: #dda0dd; box-shadow: 0 0 20px #dda0dd; font-size: 1.5em; }
        .cell[data-value="1024"] { background: #ff69b4; box-shadow: 0 0 25px #ff69b4; font-size: 1.2em; }
        .cell[data-value="2048"] { background: #00ffff; box-shadow: 0 0 30px #00ffff; font-size: 1.2em; animation: pulse 0.5s infinite; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .controls {
            margin: 20px;
            text-align: center;
        }
        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 1.2em;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 0 10px #0ff;
        }
        button:hover {
            background: #0cc;
        }
        .game-over {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 50px #f00;
            display: none;
        }
    </style>
</head>
<body>
    <h1>NEON 2048</h1>
    <div class="score">Score: <span id="score">0</span></div>
    <div class="grid" id="grid"></div>
    <div class="controls">
        <button onclick="initGame()">New Game</button>
        <p>Use Arrow Keys or Swipe to move</p>
    </div>
    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <button onclick="initGame()">Play Again</button>
    </div>

    <script>
        let grid = [];
        let score = 0;
        let gameOver = false;

        function initGame() {
            grid = Array(4).fill().map(() => Array(4).fill(0));
            score = 0;
            gameOver = false;
            document.getElementById('gameOver').style.display = 'none';
            addRandomTile();
            addRandomTile();
            updateDisplay();
        }

        function addRandomTile() {
            const empty = [];
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) empty.push([i, j]);
                }
            }
            if (empty.length === 0) return;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = Math.random() < 0.9 ? 2 : 4;
        }

        function updateDisplay() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = grid[i][j];
                    if (val) {
                        cell.textContent = val;
                        cell.setAttribute('data-value', val);
                    }
                    gridEl.appendChild(cell);
                }
            }
            document.getElementById('score').textContent = score;
            if (gameOver) {
                document.getElementById('finalScore').textContent = score;
                document.getElementById('gameOver').style.display = 'block';
            }
        }

        function slide(row) {
            let arr = row.filter(x => x);
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i] === arr[i + 1]) {
                    arr[i] *= 2;
                    score += arr[i];
                    arr.splice(i + 1, 1);
                }
            }
            while (arr.length < 4) arr.push(0);
            return arr;
        }

        function move(dir) {
            if (gameOver) return;
            let moved = false;
            let newGrid = grid.map(row => [...row]);

            if (dir === 'left') {
                for (let i = 0; i < 4; i++) {
                    newGrid[i] = slide(newGrid[i]);
                }
            } else if (dir === 'right') {
                for (let i = 0; i < 4; i++) {
                    newGrid[i] = slide(newGrid[i].reverse()).reverse();
                }
            } else if (dir === 'up') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[0][j], grid[1][j], grid[2][j], grid[3][j]];
                    col = slide(col);
                    for (let i = 0; i < 4; i++) newGrid[i][j] = col[i];
                }
            } else if (dir === 'down') {
                for (let j = 0; j < 4; j++) {
                    let col = [grid[0][j], grid[1][j], grid[2][j], grid[3][j]].reverse();
                    col = slide(col);
                    col.reverse();
                    for (let i = 0; i < 4; i++) newGrid[i][j] = col[i];
                }
            }

            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (newGrid[i][j] !== grid[i][j]) moved = true;
                }
            }

            if (moved) {
                grid = newGrid;
                addRandomTile();
                updateDisplay();
                checkGameOver();
            }
        }

        function checkGameOver() {
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 4; j++) {
                    if (grid[i][j] === 0) return;
                    if (j < 3 && grid[i][j] === grid[i][j + 1]) return;
                    if (i < 3 && grid[i][j] === grid[i + 1][j]) return;
                }
            }
            gameOver = true;
            updateDisplay();
        }

        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft') move('left');
            if (e.key === 'ArrowRight') move('right');
            if (e.key === 'ArrowUp') move('up');
            if (e.key === 'ArrowDown') move('down');
        });

        // Simple touch support
        let startX, startY;
        document.addEventListener('touchstart', e => {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });
        document.addEventListener('touchend', e => {
            const endX = e.changedTouches[0].clientX;
            const endY = e.changedTouches[0].clientY;
            const dx = endX - startX;
            const dy = endY - startY;
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 50) move('right');
                else if (dx < -50) move('left');
            } else {
                if (dy > 50) move('down');
                else if (dy < -50) move('up');
            }
        });

        initGame();
    </script>
</body>
</html>
