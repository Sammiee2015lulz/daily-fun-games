<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Asteroids</title>
<style>
body { margin:0; background:#000; color:#0ff; font-family: 'Courier New', monospace; overflow:hidden; }
canvas { display:block; margin:0 auto; background:radial-gradient(circle, #001122, #000); }
#ui { position:absolute; top:10px; left:10px; }
button { background:#111; color:#0ff; border:1px solid #0ff; padding:8px 16px; margin:5px; cursor:pointer; font-family:inherit; }
button:hover { background:#0ff; color:#000; }
</style>
</head>
<body>
<div id="ui">
<h2>Neon Asteroids</h2>
<p>Score: <span id="score">0</span> | Lives: <span id="lives">3</span></p>
<button onclick="startGame()">Start / Restart</button>
<p>Arrow keys to rotate/thrust, Space to shoot. Destroy asteroids!</p>
</div>
<canvas id="c" width="800" height="600"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let score = 0, lives = 3, gameRunning = false;
let ship = { x:400, y:300, angle:0, vx:0, vy:0, r:15 };
let bullets = [], asteroids = [];
let keys = {};

function startGame() {
  score = 0; lives = 3; gameRunning = true;
  ship = { x:400, y:300, angle:0, vx:0, vy:0, r:15 };
  bullets = []; asteroids = [];
  for(let i=0; i<5; i++) spawnAsteroid();
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
  loop();
}

function spawnAsteroid(x,y,size) {
  size = size || 40 + Math.random()*30;
  asteroids.push({
    x: x || Math.random()*800,
    y: y || Math.random()*600,
    vx: (Math.random()-0.5)*3,
    vy: (Math.random()-0.5)*3,
    r: size,
    angle: Math.random()*Math.PI*2,
    rot: (Math.random()-0.5)*0.05
  });
}

function loop() {
  if(!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

function update() {
  if(keys['ArrowLeft']) ship.angle -= 0.08;
  if(keys['ArrowRight']) ship.angle += 0.08;
  if(keys['ArrowUp']) {
    ship.vx += Math.cos(ship.angle)*0.2;
    ship.vy += Math.sin(ship.angle)*0.2;
  }
  ship.vx *= 0.99; ship.vy *= 0.99;
  ship.x += ship.vx; ship.y += ship.vy;
  if(ship.x<0) ship.x=800; if(ship.x>800) ship.x=0;
  if(ship.y<0) ship.y=600; if(ship.y>600) ship.y=0;

  bullets.forEach((b,i) => {
    b.x += b.vx; b.y += b.vy; b.life--;
    if(b.life<=0 || b.x<0||b.x>800||b.y<0||b.y>600) bullets.splice(i,1);
  });

  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy; a.angle += a.rot;
    if(a.x<0) a.x=800; if(a.x>800) a.x=0;
    if(a.y<0) a.y=600; if(a.y>600) a.y=0;
  });

  for(let i=bullets.length-1; i>=0; i--) {
    for(let j=asteroids.length-1; j>=0; j--) {
      let dx = bullets[i].x - asteroids[j].x;
      let dy = bullets[i].y - asteroids[j].y;
      if(Math.hypot(dx,dy) < asteroids[j].r) {
        score += Math.floor(50 / (asteroids[j].r/20));
        document.getElementById('score').textContent = score;
        if(asteroids[j].r > 25) {
          spawnAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].r*0.6);
          spawnAsteroid(asteroids[j].x, asteroids[j].y, asteroids[j].r*0.6);
        }
        asteroids.splice(j,1);
        bullets.splice(i,1);
        break;
      }
    }
  }

  asteroids.forEach(a => {
    let dx = ship.x - a.x, dy = ship.y - a.y;
    if(Math.hypot(dx,dy) < ship.r + a.r*0.8) {
      lives--;
      document.getElementById('lives').textContent = lives;
      ship.x=400; ship.y=300; ship.vx=0; ship.vy=0;
      if(lives <= 0) {
        gameRunning = false;
        alert('Game Over! Score: ' + score);
      }
    }
  });

  if(asteroids.length === 0) {
    for(let i=0; i<5 + Math.floor(score/100); i++) spawnAsteroid();
  }
}

function draw() {
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.fillRect(0,0,800,600);

  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.strokeStyle = '#0ff';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(20,0);
  ctx.lineTo(-10,10);
  ctx.lineTo(-10,-10);
  ctx.closePath();
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#ff0';
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 3, 0, Math.PI*2);
    ctx.fill();
  });

  asteroids.forEach(a => {
    ctx.save();
    ctx.translate(a.x, a.y);
    ctx.rotate(a.angle);
    ctx.strokeStyle = '#f0f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    for(let i=0; i<8; i++) {
      let ang = (i/8)*Math.PI*2;
      let rad = a.r * (0.7 + Math.sin(ang*3)*0.3);
      ctx.lineTo(Math.cos(ang)*rad, Math.sin(ang)*rad);
    }
    ctx.closePath();
    ctx.stroke();
    ctx.restore();
  });
}

document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code === 'Space' && gameRunning) {
    bullets.push({
      x: ship.x + Math.cos(ship.angle)*20,
      y: ship.y + Math.sin(ship.angle)*20,
      vx: Math.cos(ship.angle)*8 + ship.vx,
      vy: Math.sin(ship.angle)*8 + ship.vy,
      life: 60
    });
  }
});
document.addEventListener('keyup', e => keys[e.code] = false);

ctx.fillStyle='#000'; ctx.fillRect(0,0,800,600);
ctx.fillStyle='#0ff'; ctx.font='30px Courier'; ctx.fillText('Press Start to Play Neon Asteroids', 150, 300);
</script>
</body>
</html>
